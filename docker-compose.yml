version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: booking_mysql
    environment:
      MYSQL_DATABASE: booking_db
      MYSQL_USER: booking
      MYSQL_PASSWORD: booking
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: booking_backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: booking_db
      DB_USER: booking
      DB_PASSWORD: booking
      DB_USE_SSL: "false"
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    depends_on:
      - mysql

volumes:
  mysql_data:
